<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>

    <link rel="stylesheet" href="style.css">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
</head>
<body>

<div class="circle circle1"></div>
<div class="circle circle2"></div>
<div class="circle circle3"></div>
<div class="circle circle4"></div>

<main class="container">

    <section class="left">

        <div class="logo">
            <h2>Bahiot<span>eca</span></h2>
        </div>

        <div class="content">

            <h1>Comece sua jornada de aprendizado</h1>

            <p>
                Crie sua conta gratuitamente e tenha acesso
                a milhares de livros educacionais.
            </p>

            
        </div>

    </section>

    <section class="right">

        <div class="login-box">

            <h2>Criar Conta</h2>

            <p>Preencha seus dados abaixo.</p>

            <form id="registerForm">

                <div class="input-box">
                    <label>Nome</label>

                    <div class="input">
                        <i class="fa-solid fa-user"></i>
                        <input type="text" id="nome" placeholder="Seu nome" required>
                    </div>
                </div>

                <div class="input-box">
                    <label>Email</label>

                    <div class="input">
                        <i class="fa-solid fa-envelope"></i>
                        <input type="email" id="email" placeholder="Seu email" required>
                    </div>
                </div>

                <div class="input-box">
                    <label>Senha</label>

                    <div class="input">

                        

                        <input type="password" id="password" placeholder="Crie uma senha" required>

                        <button type="button" id="togglePassword">
                        
                        </button>

                    </div>

                </div>

                <div class="input-box">
                    <label>Confirmar Senha</label>

                    <div class="input">

                        <i class="fa-solid fa-lock"></i>

                        <input type="password" id="confirmPassword" placeholder="Repita a senha" required>

                    </div>

                </div>

                <button class="login-btn" type="submit">
                    Criar Conta
                </button>

            </form>

            <div class="register">

                Já possui uma conta?

                <a href="../login/">
                    Fazer login
                </a>

            </div>

        </div>

    </section>

</main>

<script src="cadastro.js"></script>

</body>
</html>
